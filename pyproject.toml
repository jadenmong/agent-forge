[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0.dev1"
description = "Local single-user Agent Harness, day-one mock runtime"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.1",
    "mcp==2.3.0",
    "openai==3.33.0",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "ruff==0.11.13", "playwright==1.64.0"]

[project.scripts]
agentforge-demo = "agentforge.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
