[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0.dev1"
description = "Local single-user Agent Harness, day-one mock runtime"
requires-python = ">=3.12"
dependencies = ["pydantic==2.11.7"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
agentforge-demo = "agentforge.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
