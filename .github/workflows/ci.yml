name: Mock regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -e '.[test]'
          npm --prefix apps/web ci
      - name: Formatting and static checks
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
      - name: Unit and integration tests
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Independent Mock evaluations
        run: python -m agentforge.evals run --output artifacts/mock-eval
      - name: Frontend type check and build
        run: npm --prefix apps/web run build
      - name: Browser critical path
        run: |
          python -m playwright install --with-deps chromium
          python scripts/verify_day4.py --browser-only
